[package]
name = "cellz"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["eero <songmqq@proton.me>"]
description = "SQLite-per-session, event-sourced state server for AI agents"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/EeroEternal/cellz"
homepage = "https://github.com/EeroEternal/cellz"
documentation = "https://docs.rs/cellz"
keywords = ["ai-agents", "sqlite", "event-sourcing", "sse", "durable-objects"]
categories = ["web-programming", "database", "asynchronous"]
exclude = [
    "/.agents/",
    "/.github/",
    "/admin/",
    "/docs/ai/",
    "/docs/design/",
    "/docs/design.md",
    "/scripts/",
    "/AGENTS.md",
]

[lib]
name = "cellz"
path = "src/lib.rs"

[[bin]]
name = "cellz"
path = "src/main.rs"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
tokio = { version = "1.43", features = ["full"] }
axum = { version = "0.8", features = ["json", "ws", "macros"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "sqlite", "chrono", "uuid", "migrate"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.12", features = ["v4", "serde"] }
anyhow = "1.0"
thiserror = "2.0"
async-trait = "0.1"
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
object_store = { version = "0.11", default-features = false, features = ["aws"] }

[dev-dependencies]
tokio-test = "0.4"
http-body-util = "0.1"
tempfile = "3.17"
